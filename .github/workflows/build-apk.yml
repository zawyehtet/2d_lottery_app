name: Build Native Android APK

on:
  push:
    branches: [ "original-v22", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets if present
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
            npm run build
            mkdir -p app/src/main/assets app/src/main/assets/public app/src/main/assets/www
            cp -r dist/* app/src/main/assets/
            cp -r dist/* app/src/main/assets/public/
            cp -r dist/* app/src/main/assets/www/
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Native Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          find . -name "*.apk" -type f

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lucky 2D Original v22 APK
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            build/outputs/apk/debug/*.apk
          overwrite: true
          
