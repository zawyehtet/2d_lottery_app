name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set or not a directory."
            exit 1
          fi

          JAVA_VER_FULL=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java Version: $JAVA_VER_FULL"

          MAJOR_VER=$(echo "$JAVA_VER_FULL" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $MAJOR_VER"

          if [ -z "$MAJOR_VER" ]; then
            echo "Error: Failed to detect Java major version."
            exit 1
          fi

          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Java version is $MAJOR_VER, which is lower than the required Java 17."
            exit 1
          fi

          echo "Java environment verified successfully: Major version $MAJOR_VER (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Debug Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Reusing existing file."
          else
            echo "debug.keystore missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create or locate ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== Verifying Debug APK ==="
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "APK found at expected path: $EXPECTED_APK"
            ls -lh "$EXPECTED_APK"
          else
            echo "Error: Expected APK not found or empty at $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "app/build/outputs/apk directory does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TMP_DIR=$(mktemp -d)
          cp "$SRC_APK" "$TMP_DIR/app-debug.apk"

          if [ ! -f "$TMP_DIR/app-debug.apk" ] || [ ! -s "$TMP_DIR/app-debug.apk" ]; then
            echo "Error: Failed to prepare APK release asset."
            exit 1
          fi

          echo "release_asset=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          RELEASE_ASSET="${{ steps.prepare_asset.outputs.release_asset }}"
          if [ -z "$RELEASE_ASSET" ] || [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          ASSET_NAME=$(basename "$RELEASE_ASSET")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "Error: Asset name must be exactly app-debug.apk. Found: $ASSET_NAME"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build System**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit**: ${{ github.sha }}
          - **Note**: This is an automatically generated debug APK intended for testing only. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          echo "Creating release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$RELEASE_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$TAG_NAME" || true

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release created successfully: $TAG_NAME"
            echo "Direct APK URL: $DIRECT_URL"
            echo "Backup Actions artifact 'app-debug-apk' is also available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## DIRECT APK DOWNLOAD
          [Download app-debug.apk]($DIRECT_URL)

          - **Direct URL**: \`$DIRECT_URL\`
          - **Release Tag**: \`$TAG_NAME\`
          - **Backup Artifact**: \`app-debug-apk\` remains available under GitHub Actions artifacts.
          EOF
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "Backup Actions artifact 'app-debug-apk' remains available for download."
            fi
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release Publishing Failed
          The GitHub Release could not be published automatically, but the debug APK was built and the backup Actions artifact **app-debug-apk** remains available under GitHub Actions.
          EOF
          fi
