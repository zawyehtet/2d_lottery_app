name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ]; then
            echo "Error: Unable to detect Java major version." >&2
            exit 1
          fi
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Java version must be 17 or newer. Detected version: ${JAVA_MAJOR}" >&2
            exit 1
          fi
          echo "Java environment verified successfully (version ${JAVA_MAJOR})."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${TARGET_APK}" ]; then
            echo "Error: Expected APK not found at ${TARGET_APK}" >&2
            echo "Discovered APK files in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "${TARGET_APK}" ]; then
            echo "Error: APK file is empty: ${TARGET_APK}" >&2
            exit 1
          fi
          case "${TARGET_APK}" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension: ${TARGET_APK}" >&2; exit 1 ;;
          esac
          echo "Verified APK successfully: ${TARGET_APK} ($(wc -c < "${TARGET_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          STAGING_DIR=$(mktemp -d /tmp/apk_release_staging.XXXXXX)
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${STAGING_DIR}/app-debug.apk"
          cp "${SOURCE_APK}" "${DEST_APK}"
          if [ ! -f "${DEST_APK}" ] || [ ! -s "${DEST_APK}" ]; then
            echo "Error: Failed to stage ${DEST_APK}" >&2
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at ${DEST_APK}"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Prepared APK is missing or empty." >&2
            exit 1
          fi
          case "${ASSET_PATH}" in
            *.apk) ;;
            *) echo "Error: Asset path does not end with .apk" >&2; exit 1 ;;
          esac
          ASSET_FILENAME=$(basename "${ASSET_PATH}")
          if [ "${ASSET_FILENAME}" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be exactly app-debug.apk, got: ${ASSET_FILENAME}" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}

          Notice:
          - This APK is intended for testing.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "GitHub Release successfully created!"
            gh release view "${RELEASE_TAG}" || true
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "APK Asset Name: app-debug.apk"
            echo "Direct APK Download URL: ${DIRECT_URL}"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "[Download app-debug.apk](${DIRECT_URL})"
              echo ""
              echo "Direct download link:"
              echo "\`${DIRECT_URL}\`"
              echo ""
              echo "*Backup artifact \`app-debug-apk\` remains available under GitHub Actions artifacts.*"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The Actions artifact named 'app-debug-apk' remains available as a backup."
            {
              echo "### Build Status"
              echo ""
              echo "GitHub Release creation did not succeed, but the Actions artifact \`app-debug-apk\` is preserved."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
