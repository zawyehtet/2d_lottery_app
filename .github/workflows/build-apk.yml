name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          echo "Detected Java version string: ${JAVA_VER_STRING}"
          JAVA_MAJOR=$(echo "${JAVA_VER_STRING}" | cut -d'.' -f1)
          if [ "${JAVA_MAJOR}" = "1" ]; then
            JAVA_MAJOR=$(echo "${JAVA_VER_STRING}" | cut -d'.' -f2)
          fi
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ] || ! [ "${JAVA_MAJOR}" -eq "${JAVA_MAJOR}" ] 2>/dev/null; then
            echo "ERROR: Could not detect active Java major version." >&2
            exit 1
          fi
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or higher (detected: ${JAVA_MAJOR})." >&2
            exit 1
          fi
          echo "Java environment verified successfully (version: ${JAVA_MAJOR})."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "Temporary debug keystore already exists at ${KEYSTORE_PATH}."
          else
            echo "Generating temporary debug keystore at ${KEYSTORE_PATH}..."
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "${KEYSTORE_PATH}" ]; then
            echo "ERROR: Failed to create debug keystore at ${KEYSTORE_PATH}." >&2
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${TARGET_APK}" ]; then
            echo "ERROR: Target APK '${TARGET_APK}' was not found!" >&2
            echo "Searching only inside app/build/outputs/apk for any generated APKs:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print >&2
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          if [ ! -s "${TARGET_APK}" ]; then
            echo "ERROR: Generated APK '${TARGET_APK}' is empty (0 bytes)." >&2
            exit 1
          fi
          case "${TARGET_APK}" in
            *.apk) ;;
            *) echo "ERROR: File '${TARGET_APK}' does not have .apk extension." >&2; exit 1 ;;
          esac
          echo "Target APK verified successfully:"
          ls -lh "${TARGET_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR=$(mktemp -d)
          DEST_APK="${TEMP_DIR}/app-debug.apk"
          cp "${SRC_APK}" "${DEST_APK}"
          if [ ! -f "${DEST_APK}" ] || [ ! -s "${DEST_APK}" ]; then
            echo "ERROR: Failed to prepare release asset at ${DEST_APK}." >&2
            exit 1
          fi
          echo "Release asset prepared at: ${DEST_APK}"
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "${ASSET_PATH}" ]; then
            echo "ERROR: Release asset '${ASSET_PATH}' does not exist." >&2
            exit 1
          fi
          if [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Release asset '${ASSET_PATH}' is empty." >&2
            exit 1
          fi
          ASSET_FILENAME=$(basename "${ASSET_PATH}")
          if [ "${ASSET_FILENAME}" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly 'app-debug.apk' (got '${ASSET_FILENAME}')." >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}

          > **Notice**: This APK is intended strictly for development and testing. It is not a production release for Google Play and is signed with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "=== GitHub Release Publishing Succeeded ==="
            gh release view "${RELEASE_TAG}" || true
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Asset: app-debug.apk"
            echo "Direct Download URL: ${DIRECT_URL}"
            echo "Actions Backup Artifact: app-debug-apk"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 DIRECT APK DOWNLOAD

          **Direct URL**: [${DIRECT_URL}](${DIRECT_URL})

          - **Release Tag**: \`${RELEASE_TAG}\`
          - **Asset**: \`app-debug.apk\`
          - **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also available.
          EOF
          else
            echo "WARNING: GitHub Release publishing failed or was skipped." >&2
            echo "Outcome: ${PUBLISH_OUTCOME}" >&2
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully and is preserved as the Actions artifact 'app-debug-apk'."
            fi
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ GitHub Release Publishing Notice

          GitHub Release creation was not completed. However, if the APK build succeeded, the debug APK is available as the GitHub Actions artifact **\`app-debug-apk\`**.
          EOF
          fi
